[package]
name = "dionysen-git-sync"
version = "0.1.0"
description = "GitHub/Gitee OAuth + encrypted vault + PWB backup sync for Dionysen apps"
authors = ["Dionysen"]
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2" }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
urlencoding = "2"
open = "5"
hostname = "0.4"
purewriter-store = { path = "../purewriter-store" }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
