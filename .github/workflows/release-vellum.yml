name: Release Vellum

# Builds Vellum for macOS / Windows / Linux, signs updater artifacts,
# and uploads installers + latest.json to a draft GitHub Release.
#
# Tags look like vellum-v0.1.0 so they do not match Inimark's v1.2.3 releases.
# The draft is never marked Latest. Publishing the draft runs
# release-vellum-channel.yml, which copies latest.json onto the standing
# vellum-latest release (also not Latest). In-app updates read:
#   https://github.com/Dionysen/Inimark/releases/download/vellum-latest/latest.json
#
# Required repository secrets (same key pair as Inimark):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Trigger:
#   git tag vellum-v0.1.0 && git push origin vellum-v0.1.0
#   or Actions → Release Vellum → Run workflow
#
# Notes come from apps/vellum/docs/版本历史.md. Publish the draft before
# expecting in-app downloads to succeed.

on:
  workflow_dispatch:
  push:
    tags:
      - "vellum-v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/vellum/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_REF="${GITHUB_REF_NAME#vellum-v}"
          else
            VERSION_REF="$(node -p "JSON.parse(require('fs').readFileSync('apps/vellum/src-tauri/tauri.conf.json','utf8')).version")"
          fi
          BODY="$(node scripts/extract-release-notes.mjs "${VERSION_REF}" --fallback --file "apps/vellum/docs/版本历史.md")"
          {
            echo "body<<EOF"
            printf '%s\n' "${BODY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/vellum/src-tauri
          tagName: vellum-v__VERSION__
          releaseName: Vellum v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Runs after every platform upload. A draft must not become GitHub Latest,
  # or Inimark's updater (releases/latest) would fetch Vellum's latest.json.
  unmark-latest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep this draft off Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/vellum/src-tauri/tauri.conf.json','utf8')).version")"
          gh release edit "vellum-v${VERSION}" --latest=false --repo "${GITHUB_REPOSITORY}"
