[[permission]]
identifier = "allow-app"
description = "Allow Vellum application IPC commands"
commands.allow = [
  "show_settings_window",
  "toggle_settings_window",
  "show_aux_window",
  "toggle_aux_window",
  "pw_open",
  "pw_close",
  "pw_schema_status",
  "pw_list_folders",
  "pw_list_categories",
  "pw_list_articles",
  "pw_get_article",
  "pw_create_folder",
  "pw_create_category",
  "pw_create_article",
  "pw_update_article",
  "pw_trash_article",
  "pw_list_settings",
  "pw_set_setting",
  "pw_pwb_export",
  "pw_pwb_import",
  "cs_begin_oauth",
  "cs_complete_oauth",
  "cs_get_session",
  "cs_get_profile",
  "cs_logout",
  "cs_list_siblings",
  "cs_adopt_session",
  "cs_configure_oss",
  "cs_oss_list",
  "cs_oss_get",
  "cs_oss_put",
  "cs_oss_delete",
  "cs_oss_head",
  "cs_open_url",
  "cs_open_oauth_login",
  "cs_ensure_access_token",
]
