[[permission]]
identifier = "allow-app"
description = "Allow Vellum application IPC commands"
commands.allow = [
  "show_settings_window",
  "toggle_settings_window",
  "show_aux_window",
  "toggle_aux_window",
  "list_system_fonts",
  "pw_open",
  "pw_close",
  "pw_schema_status",
  "pw_list_folders",
  "pw_list_categories",
  "pw_list_articles",
  "pw_get_article",
  "pw_create_folder",
  "pw_create_category",
  "pw_create_article",
  "pw_update_article",
  "pw_trash_article",
  "pw_list_settings",
  "pw_set_setting",
  "pw_pwb_export",
  "pw_pwb_import",
  "pw_git_push_now",
  "pw_git_restore",
  "gs_begin_oauth",
  "gs_complete_oauth",
  "gs_get_session",
  "gs_logout",
  "gs_open_oauth_login",
  "gs_open_url",
  "gs_ensure_repo",
  "gs_init_repo",
  "gs_list_remote_backups",
]
