[package]
name = "inimark-desktop"
version = "1.0.3"
description = "Inimark — native Markdown editor"
authors = ["Dionysen"]
edition = "2021"

[lib]
name = "inimark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inimark-ssg = { path = "../../../crates/inimark-ssg" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
fontdb = "0.23"
tauri-plugin-updater = { version = "2.11.0", default-features = true }
tauri-plugin-process = "2.3.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net"] }
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSampler", "NSColorSpace", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
