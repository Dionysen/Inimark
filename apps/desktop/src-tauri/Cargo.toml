[package]
name = "inimark-desktop"
version = "0.1.5"
description = "Inimark — native Markdown editor"
authors = ["Dionysen"]
edition = "2021"

[lib]
name = "inimark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Same approach as Inimark: patch wry so Overlay traffic lights are vertically
# centered (y is top inset with matching bottom) and re-applied from drawRect
# on every paint — that is what prevents resize flicker.
[patch.crates-io]
wry = { path = "vendor/wry" }
