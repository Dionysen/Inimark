[package]
name = "inimark-desktop"
version = "0.1.0"
description = "Inimark — native Markdown editor"
authors = ["Dionysen"]
edition = "2021"

[lib]
name = "inimark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS: center Overlay traffic lights (stock wry leaves them flush-top)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSButton",
  "NSControl",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
